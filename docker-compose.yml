services:
  postgres:
    image: postgres:16
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_inmobiliario
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password_dev
    ports:
      - "5432:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data

volumes:
  crm_postgres_data: