spring.application.name=crm-backend
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm_inmobiliario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:crm_password_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

anthropic.api-key=${ANTHROPIC_API_KEY:}

# Binario de ffmpeg para armar el video-slideshow de marketing, y fuente TTF para el
# texto superpuesto. En produccion (Docker) ambos ya quedan instalados/configurados.
ffmpeg.path=${FFMPEG_PATH:ffmpeg}
ffmpeg.font-path=${FFMPEG_FONT_PATH:}
ffmpeg.musica-fondo-path=${FFMPEG_MUSICA_FONDO_PATH:}

# Piper (TTS neuronal local) para la voz en off del video-slideshow de marketing. Si se dejan
# vacias, la opcion de voz en off queda deshabilitada (el video se genera igual, sin narracion).
piper.path=${PIPER_PATH:}
piper.voz-modelo-path=${PIPER_VOZ_MODELO_PATH:}

# Credenciales de Twilio para enviar SMS de notificacion de visitas. Si se dejan
# vacias, el envio de SMS queda deshabilitado (advertencia en el log de arranque).
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.numero-origen=${TWILIO_NUMERO_ORIGEN:}

server.error.include-stacktrace=never
server.error.include-exception=false

server.port=${PORT:8080}
# Railway termina TLS en su proxy y reenvia la peticion por HTTP con encabezados
# X-Forwarded-*; sin esto, request.getScheme()/getServerName() verian "http" y el
# proxy en vez del dominio publico real (afecta, por ejemplo, las URLs absolutas
# que se generan para la vista previa de WhatsApp/Facebook de la landing publica).
server.forward-headers-strategy=framework

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Password del admin inicial (solo se usa si la tabla de usuarios esta vacia).
# Si se deja vacia, se genera una aleatoria y se imprime una unica vez en el log de arranque.
admin.password-inicial=${ADMIN_PASSWORD_INICIAL:}

# Secreto compartido que deben enviar los portales inmobiliarios en el encabezado
# X-Webhook-Secret al llamar /api/webhooks/portales/leads. Si se deja vacio, el
# endpoint queda sin esa validacion (advertencia en el log de arranque).
webhooks.portales.secret=${WEBHOOKS_PORTALES_SECRET:}

# Origenes adicionales (aparte de localhost/ngrok/red local) permitidos por CORS,
# separados por coma. Debe incluir el dominio publico de produccion, por ejemplo
# https://mi-app.up.railway.app o un dominio propio.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

storage.uploads-dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Cloudflare R2 (compatible con S3) para fotos/videos pesados. Si se dejan vacias,
# los archivos siguen guardandose en el volumen local (storage.uploads-dir) como hasta ahora.
storage.r2.account-id=${R2_ACCOUNT_ID:}
storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
storage.r2.bucket=${R2_BUCKET:}
storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# Swagger/OpenAPI quedan activos por defecto (utiles en desarrollo local).
# En produccion se apagan con SPRINGDOC_ENABLED=false para no exponer
# publicamente la forma de la API sin autenticacion.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
